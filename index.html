<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PD Hierarchy Official</title><link rel="stylesheet" href="eai-theme.css?v=20261005-reset2"><link rel="stylesheet" href="setting.css?v=20261005-reset2"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body>
<header><h1>eManager Admin (EAI 2.0)</h1><span>☰</span><span class="top-right">PD Hierarchy POC v2.7</span></header>
<div class="setting-shell"><aside aria-label="側邊選單"><span>▤</span><span>⚙</span><span>▣</span><span>⚙</span></aside><main><h2 id="pageTitle">PD Hierarchy Official</h2><section class="setting-panel"><div class="blue-bar"></div><div class="setting-body">
<button id="modeToggle" class="mode-switch" aria-label="切換至 Test 列表" aria-pressed="false"><span id="modeLabel">OFFICIAL</span><span class="switch-knob"></span></button>
<div class="setting-toolbar"><button id="clearPoc" class="btn" title="清除目前瀏覽器的 Official 與 Test 記錄">清除 POC 資料</button><button id="addTest" class="btn" title="新增 Test" hidden>＋ 新增 Test</button><label id="officialImport" class="btn">載入 Official Excel（POC）<input id="officialFile" type="file" accept=".xlsx,.xls" hidden></label><label id="officialYearLabel">Year <select id="officialYear"><option>2026</option><option>2027</option><option>2025</option></select></label><span class="hint" id="scopeNote">POC 以本機儲存模擬 Official 資料；可載入該年度正式 Excel 作為 Baseline。</span></div>
<div class="table-wrap setting-table"><table><thead><tr><th>Year</th><th>Remark</th><th>Effective Date</th><th>操作</th></tr></thead><tbody id="recordsBody"></tbody></table></div>
</div></section></main></div>
<div class="modal" id="contentModal"><div class="modal-box"><h3 id="contentTitle">PD Hierarchy Content</h3><div class="tabs" id="contentTabs"></div><div class="table-wrap" id="contentTable"></div><div class="actions" style="margin-top:14px"><button class="btn" id="closeContent">Close</button></div></div></div>
